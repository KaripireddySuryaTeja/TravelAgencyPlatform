spring.data.mongodb.uri=mongodb://127.0.0.1:27017/travelagency
spring.data.mongodb.database=travelagency

app.jwt.secret=local-mock-profile-secret-do-not-use-in-production-32-bytes
spring.mail.username=local@example.invalid
spring.mail.password=local-development-only
app.password-reset.from-email=local@example.invalid
spring.rabbitmq.host=localhost
app.rabbitmq.enabled=false
app.captcha.enabled=false

spring.security.oauth2.client.registration.google.client-id=local-google-client-id
spring.security.oauth2.client.registration.google.client-secret=local-google-client-secret

# ============================================================
# Local development overrides (frontend runs on http://localhost:3000)
# ============================================================
server.port=8080
app.server.url=http://localhost:8080
app.frontend.url=http://localhost:3000
app.cors.allowed-origins=http://localhost:3000

# Store uploaded documents on local disk instead of S3
app.documents.storage-provider=local

# OAuth2 social login redirect targets
app.oauth2.redirect-success-url=http://localhost:3000/oauth-success
app.oauth2.redirect-failure-url=http://localhost:3000/sign-in?error=

# ClamAV / RabbitMQ are optional external services — keep disabled for local runs
app.documents.clamav.enabled=false