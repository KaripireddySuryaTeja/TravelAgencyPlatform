# ─────────────────────────────────────────────────────────────────────────────
# Kubernetes Secret – Azure OpenAI Credentials
#
# PURPOSE
#   Provides the AZURE_OPENAI_API_KEY environment variable to the backend pod
#   without embedding secrets in source code or Docker images.
#
# USAGE
#   1. Base64-encode your real API key:
#         echo -n "your-real-azure-openai-api-key" | base64
#
#   2. Replace REPLACE_WITH_BASE64_ENCODED_KEY below with the output.
#
#   3. Apply to the cluster:
#         kubectl apply -f azure-openai-secret.yaml -n <namespace>
#
# KubeRocketCI / EPAM Delivery Platform note:
#   Store real secrets in the platform's Vault / secret manager and reference
#   them via ExternalSecret or the platform's secret injection mechanism.
#   Never commit real base64-encoded secrets to version control.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: azure-openai-secret
  namespace: travel-agency          # adjust to your namespace
  labels:
    app: travel-agency-backend
    component: ai-moderation
type: Opaque
data:
  # base64-encoded Azure OpenAI API key
  # Generate: echo -n "YOUR_REAL_KEY" | base64
  api-key: UkVQTEFDRV9XSVRIX0JBU0U2NF9FTkNPREVEX0tFWQ==   # placeholder

