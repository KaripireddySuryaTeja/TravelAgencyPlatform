# MongoDB Configuration
spring.data.mongodb.uri=${MONGO_URI}
spring.data.mongodb.database=travelagency

# Server Configuration
server.port=8080

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.ttl-hours=24

# CORS Configuration
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Authentication Configuration
app.auth.max-failed-attempts=5
app.auth.lockout-minutes=15

# Logging
logging.level.org.springframework.data.mongodb=WARN

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
app.server.url=${APP_SERVER_URL:http://localhost:8080}

# Document storage
app.documents.storage-provider=s3
app.documents.max-file-size-bytes=2097152

# S3 settings
app.documents.s3.enabled=true
app.documents.s3.bucket=${AWS_S3_BUCKET:your-s3-bucket-name}
app.documents.s3.region=${AWS_REGION:eu-west-3}
app.documents.s3.key-prefix=tour-documents
app.documents.s3.endpoint=
app.documents.s3.path-style-access-enabled=false

# AES-256 key for document encryption (32-byte key, base64-encoded)
app.documents.security.encryption-key-base64=${DOCUMENTS_ENCRYPTION_KEY_BASE64}

# Antivirus integration (ClamAV)
app.documents.clamav.enabled=${CLAMAV_ENABLED:false}
app.documents.clamav.host=${CLAMAV_HOST:localhost}
app.documents.clamav.port=${CLAMAV_PORT:3310}

# Document retention cleanup
app.documents.retention.unverified-days=${DOCUMENTS_RETENTION_UNVERIFIED_DAYS:2}
app.documents.retention.cleanup-cron=${DOCUMENTS_RETENTION_CLEANUP_CRON:0 0 * * * *}

# CAPTCHA (Google reCAPTCHA v2)
app.captcha.enabled=${CAPTCHA_ENABLED:true}
app.captcha.secret-key=${CAPTCHA_SECRET_KEY:}
app.captcha.site-key=${CAPTCHA_SITE_KEY:}

# RabbitMQ (set app.rabbitmq.enabled=true to activate event publishing)
app.rabbitmq.enabled=${APP_RABBITMQ_ENABLED:false}
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
app.rabbitmq.exchange=travel-agency.exchange
app.rabbitmq.queue=booking.events.queue
app.rabbitmq.routing-key=booking.event

# AWS S3 Configuration
aws.access-key=${AWS_ACCESS_KEY:}
aws.secret-key=${AWS_SECRET_KEY:}
aws.session-token=${AWS_SESSION_TOKEN:}
aws.region=${AWS_REGION:eu-west-3}
aws.s3.bucket=${AWS_S3_BUCKET:your-s3-bucket-name}

# Seed data passwords (leave empty to generate a random one at startup)
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}
app.seed.agent-password=${SEED_AGENT_PASSWORD:}

# Multipart Upload Limits (increased to 10MB to support report analysis uploads)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Email Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Password Reset Configuration
app.password-reset.code-expiry-minutes=15
app.password-reset.from-email=${MAIL_USERNAME}

# ============================================================
# OAuth2 Social Login Configuration (US_16)
# ============================================================
# Google OAuth2 - OAuth2 login starts from /oauth2/authorization/google
# After Google auth, Google redirects back to /login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# Facebook OAuth2 - OAuth2 login starts from /oauth2/authorization/facebook
# After Facebook auth, Facebook redirects back to /login/oauth2/code/facebook
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID:}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile

# Facebook provider settings — explicitly request id, name, email, picture fields
# and declare that 'id' is the unique user identifier (Facebook uses 'id', not 'sub')
spring.security.oauth2.client.provider.facebook.authorization-uri=https://www.facebook.com/v18.0/dialog/oauth
spring.security.oauth2.client.provider.facebook.token-uri=https://graph.facebook.com/v18.0/oauth/access_token
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/me?fields=id,name,email,picture
spring.security.oauth2.client.provider.facebook.user-name-attribute=id

# Frontend redirect URLs after OAuth2 success or failure
# Override OAUTH2_REDIRECT_SUCCESS_URL / OAUTH2_REDIRECT_FAILURE_URL in prod
app.oauth2.redirect-success-url=${OAUTH2_REDIRECT_SUCCESS_URL:http://localhost:3000/oauth-success}
app.oauth2.redirect-failure-url=${OAUTH2_REDIRECT_FAILURE_URL:http://localhost:3000/sign-in?error=}

# Frontend base URL (for email links)
app.frontend.url=${APP_FRONTEND_URL:http://localhost:3000}

# ============================================================
# Azure OpenAI ? AI-Powered Content Moderation Configuration
# Credentials are injected via Kubernetes Secrets in production.
# NEVER hardcode real secrets here.
# ============================================================
app.moderation.ai.endpoint=${AZURE_OPENAI_ENDPOINT:https://your-resource.openai.azure.com/}
app.moderation.ai.api-key=${AZURE_OPENAI_API_KEY:}
app.moderation.ai.deployment=${AZURE_OPENAI_DEPLOYMENT:gpt-4.1-mini-2025-04-14}
app.moderation.ai.timeout-seconds=${AZURE_OPENAI_TIMEOUT_SECONDS:30}

# ============================================================
# Report Analysis AI Configuration (Admin Report Analyzer)
# Re-uses the same Azure OpenAI proxy endpoint and API key.
# Credentials are injected via Kubernetes Secrets in production.
# ============================================================
azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT:https://your-resource.openai.azure.com/}
azure.openai.api-key=${AZURE_OPENAI_API_KEY:}
azure.openai.deployment-name=${AZURE_OPENAI_DEPLOYMENT:gpt-4.1-mini-2025-04-14}

